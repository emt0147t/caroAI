name: CaroAI CI

on:
  push:
    branches:
      - develop
      - "feature/**"
  pull_request:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      release_approved:
        description: "Request production release; production Environment review is independently required"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend syntax and regression checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --check frontend/Caro_AI/trong_tran/script.js
      - run: node --test tests/frontend-regression.test.cjs

  test:
    name: Python tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - run: |
          python -m flake8 app tests scripts \
            --count \
            --max-complexity=10 \
            --max-line-length=127 \
            --statistics
      - run: python -m pytest -q tests/
      - run: docker compose config --quiet

  postgres-integration:
    name: PostgreSQL service/API/migration acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: caroai_test
          POSTGRES_USER: caroai_test
          POSTGRES_PASSWORD: caroai_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U caroai_test -d caroai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://caroai_test:caroai_test_password@localhost:5432/caroai_test
      CAROAI_TEST_DATABASE_CONFIRMED: disposable-test-database
      CAROAI_TEST_POSTGRES_ALLOWLIST: localhost:5432/caroai_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run PostgreSQL model and application acceptance tests
        run: >-
          python -m pytest -q
          tests/test_database_postgres.py tests/postgres_suite.py
          --junitxml=postgres-junit.xml
      - name: Fail if any PostgreSQL acceptance test was skipped
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("postgres-junit.xml").getroot()
          skipped = root.findall(".//skipped")
          if skipped:
              raise SystemExit(
                  f"PostgreSQL acceptance suite skipped {len(skipped)} test(s)"
              )
          print("PostgreSQL acceptance suite completed with zero skipped tests.")
          PY

  compose-smoke:
    name: Compose API/database persistence after restart
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_DB: caroai_test
      POSTGRES_USER: caroai_test
      POSTGRES_PASSWORD: caroai_smoke_password
      APP_PORT: "8000"
      FRONTEND_PORT: "8080"
    steps:
      - uses: actions/checkout@v4
      - name: Build and start disposable Compose stack
        run: |
          if ! docker compose up --build -d; then
            docker compose ps
            docker compose logs --no-color db app
            exit 1
          fi
      - name: Verify PvP/PvAI, game detail, history, and restart persistence
        run: |
          python - <<'PY'
          import json
          import subprocess
          import time
          import urllib.request

          BASE = "http://127.0.0.1:8000"

          def request(method, path, payload=None):
              body = None if payload is None else json.dumps(payload).encode()
              headers = {"Content-Type": "application/json"} if body else {}
              req = urllib.request.Request(
                  BASE + path, data=body, headers=headers, method=method
              )
              with urllib.request.urlopen(req, timeout=10) as response:
                  raw = response.read().decode()
                  return response.status, json.loads(raw) if raw else {}

          def retry_get(path):
              last_error = None
              for _ in range(30):
                  try:
                      status, body = request("GET", path)
                      if status == 200:
                          return body
                      last_error = RuntimeError(f"{path}: HTTP {status}")
                  except Exception as exc:
                      last_error = exc
                  time.sleep(2)
              raise RuntimeError(f"Timed out waiting for {path}: {last_error}")

          try:
              retry_get("/api/history")

              status, pvp = request(
                  "POST", "/api/games", {"mode": "HUMAN_VS_HUMAN"}
              )
              assert status == 201 and pvp.get("id"), ("PvP create", status, pvp)
              pvp_id = pvp["id"]
              status, pvp_move = request(
                  "POST", f"/api/games/{pvp_id}/moves",
                  {"row": 3, "col": 4},
              )
              assert status == 200 and pvp_move["game"]["move_count"] == 1
              assert pvp_move["game"]["board"][3][4] == "X"

              status, pvai = request(
                  "POST", "/api/games", {"mode": "HUMAN_VS_AI"}
              )
              assert status == 201 and pvai.get("id"), ("PvAI create", status, pvai)
              pvai_id = pvai["id"]
              status, human_move = request(
                  "POST", f"/api/games/{pvai_id}/moves",
                  {"row": 7, "col": 7},
              )
              assert status == 200 and human_move["game"]["move_count"] == 1
              assert human_move["game"]["current_player"] == "O"

              status, ai_move = request(
                  "POST", f"/api/games/{pvai_id}/ai-move",
                  {"difficulty": "easy"},
              )
              assert status == 200 and ai_move["game"]["move_count"] == 2
              assert ai_move["move"]["player"] == "O"

              pvp_detail = retry_get(f"/api/games/{pvp_id}")
              pvai_detail = retry_get(f"/api/games/{pvai_id}")
              assert pvp_detail["move_count"] == 1
              assert pvp_detail["board"][3][4] == "X"
              assert pvai_detail["move_count"] == 2
              assert any(cell == "X" for row in pvai_detail["board"] for cell in row)
              assert any(cell == "O" for row in pvai_detail["board"] for cell in row)

              subprocess.run(
                  ["docker", "compose", "restart", "app"],
                  check=True, timeout=60,
              )
              restored_pvp = retry_get(f"/api/games/{pvp_id}")
              restored_pvai = retry_get(f"/api/games/{pvai_id}")
              assert restored_pvp["move_count"] == 1
              assert restored_pvp["board"][3][4] == "X"
              assert restored_pvai["move_count"] == 2

              history = retry_get("/api/history?limit=100&offset=0")
              records = {item["id"]: item for item in history["items"]}
              assert pvp_id in records and pvai_id in records
              assert records[pvp_id]["move_count"] == 1
              assert records[pvai_id]["move_count"] == 2
              print(
                  "Disposable Compose acceptance passed: PvP, PvAI, AI move, "
                  "game detail, history, and API-restart persistence."
              )
          except Exception:
              subprocess.run(
                  ["docker", "compose", "logs", "--no-color", "app", "db"],
                  check=False,
              )
              raise
          PY
      - name: Stop and remove disposable Compose resources
        if: always()
        run: docker compose down --volumes --remove-orphans

  secret-scan:
    name: Secret scan (PR diff and full Git history)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan PR commit range with Gitleaks Action
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
      - name: Scan every commit reachable from this branch
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --redact --verbose --no-banner /repo

  build:
    name: Docker image build (no publish/deploy)
    needs: [frontend, test, postgres-integration, compose-smoke, secret-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build SHA-tagged candidate image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: caroai-ci:${{ github.sha }}

  release:
    name: Approved production publish and Render verification
    timeout-minutes: 20
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_approved == true }}
    needs: [frontend, test, postgres-integration, compose-smoke, secret-scan, build]
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read
    env:
      IMAGE_NAME: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/caroai
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate environment-scoped release configuration
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          PUBLIC_URL: ${{ vars.CAROAI_PUBLIC_URL }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo "Missing production Environment secret DOCKERHUB_USERNAME"; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo "Missing production Environment secret DOCKERHUB_TOKEN"; exit 1; }
          test -n "$RENDER_DEPLOY_HOOK" || { echo "Missing production Environment secret RENDER_DEPLOY_HOOK"; exit 1; }
          test -n "$RENDER_API_KEY" || { echo "Missing production Environment secret RENDER_API_KEY"; exit 1; }
          test -n "$RENDER_SERVICE_ID" || { echo "Missing production Environment secret RENDER_SERVICE_ID"; exit 1; }
          test -n "$PUBLIC_URL" || { echo "Missing production Environment variable CAROAI_PUBLIC_URL"; exit 1; }
          python - <<'PY'
          import ipaddress
          import os
          import re
          from urllib.parse import urlsplit

          value = os.environ["PUBLIC_URL"]
          parsed = urlsplit(value)
          if parsed.scheme != "https" or not parsed.hostname:
              raise SystemExit("CAROAI_PUBLIC_URL must be an HTTPS URL with a hostname")
          hostname = parsed.hostname
          try:
              ipaddress.ip_address(hostname)
          except ValueError:
              labels = hostname.rstrip(".").split(".")
              valid_label = re.compile(
                  r"^[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?$"
              )
              if len(labels) < 2 or any(not valid_label.fullmatch(label) for label in labels):
                  raise SystemExit("CAROAI_PUBLIC_URL must contain a valid public hostname or IP address")
          if parsed.username or parsed.password:
              raise SystemExit("CAROAI_PUBLIC_URL must not contain URL credentials")
          if parsed.query or parsed.fragment or parsed.path:
              raise SystemExit("CAROAI_PUBLIC_URL must not contain a path, query, or fragment")
          try:
              parsed.port
          except ValueError as exc:
              raise SystemExit(f"CAROAI_PUBLIC_URL has an invalid port: {exc}")
          if value.endswith("/"):
              raise SystemExit("CAROAI_PUBLIC_URL must not end with a slash")
          print("Public URL format is valid (HTTPS, hostname present, no credentials/path/query/fragment).")
          PY
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Derive full and short SHA tags
        id: tags
        shell: bash
        run: |
          echo "short_sha=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
          echo "full_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "Release source SHA: $GITHUB_SHA"
      - name: Build and publish full/short SHA-tagged image references
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.short_sha }}
      - name: Record published image digest
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          test -n "$IMAGE_DIGEST" || { echo "Docker build did not return an image digest"; exit 1; }
          echo "Published image digest: $IMAGE_DIGEST"
      - name: Trigger Render deployment for exact full-SHA image
        id: render-deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          response=$(curl --fail --silent --show-error --get \
            --data-urlencode "imgURL=$IMAGE_NAME:$GITHUB_SHA" \
            "$RENDER_DEPLOY_HOOK")
          deploy_id=$(printf '%s' "$response" | python -c 'import json,sys; print(json.load(sys.stdin).get("deploy", {}).get("id", ""))')
          test -n "$deploy_id" || { echo "Render did not return a deployment ID"; exit 1; }
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"
          echo "Render deployment ID: $deploy_id"
      - name: Wait for Render to confirm exact image is live
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          DEPLOY_ID: ${{ steps.render-deploy.outputs.deploy_id }}
        run: |
          for attempt in $(seq 1 60); do
            response=$(curl --fail --silent --show-error \
              --header "Authorization: Bearer $RENDER_API_KEY" \
              --header "Accept: application/json" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID")
            status=$(printf '%s' "$response" | python -c 'import json,sys; print(json.load(sys.stdin).get("status", ""))')
            image_ref=$(printf '%s' "$response" | python -c 'import json,sys; print(json.load(sys.stdin).get("image", {}).get("ref", ""))')
            echo "Render deploy status=$status image=$image_ref"
            if [ "$status" = "live" ]; then
              if [ "$image_ref" = "$IMAGE_NAME:$GITHUB_SHA" ]; then
                echo "Render confirms the exact requested image is live: $image_ref"
                break
              fi
              echo "Render image ref mismatch: expected $IMAGE_NAME:$GITHUB_SHA"
              exit 1
            fi
            case "$status" in
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "Render deployment failed with status: $status"; exit 1 ;;
            esac
            if [ "$attempt" -eq 60 ]; then
              echo "Timed out waiting for Render deployment to become live"; exit 1
            fi
            sleep 10
          done
      - name: Verify public HTTPS liveness and database readiness (read-only)
        timeout-minutes: 8
        env:
          PUBLIC_URL: ${{ vars.CAROAI_PUBLIC_URL }}
        run: |
          check_endpoint() {
            endpoint="$1"
            for attempt in $(seq 1 36); do
              code=$(curl --connect-timeout 5 --max-time 10 --fail --silent \
                --output /dev/null --write-out "%{http_code}" \
                "$PUBLIC_URL/$endpoint" 2>/dev/null || true)
              case "$code" in
                2??)
                  echo "GET /$endpoint passed (HTTP $code; attempt $attempt)."
                  return 0
                  ;;
              esac
              echo "GET /$endpoint not ready (HTTP ${code:-no response}; attempt $attempt/36)."
              sleep 10
            done
            echo "GET /$endpoint failed after 36 attempts."
            return 1
          }
          check_endpoint health
          check_endpoint ready
          echo "Production verification passed using GET-only health/readiness checks."
