name: CaroAI CI

on:
  push:
    branches:
      - develop
      - "feature/**"
  pull_request:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      release_approved:
        description: "Release candidate approved for production deployment"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend syntax and regression checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --check frontend/Caro_AI/trong_tran/script.js
      - run: node --test tests/frontend-regression.test.cjs

  test:
    name: Run tests and lint
    runs-on: ubuntu-latest
    steps:
      - name: Enforce explicit main-branch release approval
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_APPROVED: ${{ inputs.release_approved }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || { echo "Release dispatch must target main"; exit 1; }
          test "$RELEASE_APPROVED" = "true" || { echo "Release candidate approval is required"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - run: |
          python -m flake8 app tests scripts \
            --count \
            --max-complexity=10 \
            --max-line-length=127 \
            --statistics
      - run: python -m pytest -q tests/
      - run: docker compose config --quiet

  postgres-integration:
    name: PostgreSQL service/API/migration acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: caroai_test
          POSTGRES_USER: caroai_test
          POSTGRES_PASSWORD: caroai_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U caroai_test -d caroai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://caroai_test:caroai_test_password@localhost:5432/caroai_test
      CAROAI_TEST_DATABASE_CONFIRMED: disposable-test-database
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run PostgreSQL model and application acceptance tests
        run: >-
          python -m pytest -q
          tests/test_database_postgres.py tests/postgres_suite.py
          --junitxml=postgres-junit.xml
      - name: Fail if any PostgreSQL acceptance test was skipped
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("postgres-junit.xml").getroot()
          skipped = root.findall(".//skipped")
          if skipped:
              raise SystemExit(
                  f"PostgreSQL acceptance suite skipped {len(skipped)} test(s)"
              )
          print("PostgreSQL acceptance suite completed with zero skipped tests.")
          PY

  compose-smoke:
    name: Compose API/database persistence after restart
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_DB: caroai_test
      POSTGRES_USER: caroai_test
      POSTGRES_PASSWORD: caroai_smoke_password
      APP_PORT: "8000"
      FRONTEND_PORT: "8080"
    steps:
      - uses: actions/checkout@v4
      - name: Build and start disposable Compose stack
        run: |
          if ! docker compose up --build -d; then
            docker compose ps
            docker compose logs --no-color db app
            exit 1
          fi
      - name: Verify create/move, restart the API, and read persisted state
        run: |
          python - <<'PY'
          import json
          import subprocess
          import time
          import urllib.error
          import urllib.request

          BASE = "http://127.0.0.1:8000"

          def request(method, path, payload=None):
              body = None if payload is None else json.dumps(payload).encode()
              headers = {"Content-Type": "application/json"} if body else {}
              req = urllib.request.Request(
                  BASE + path, data=body, headers=headers, method=method
              )
              with urllib.request.urlopen(req, timeout=5) as response:
                  return response.status, json.loads(response.read().decode())

          def retry_get(path, expected_status=200):
              last_error = None
              for _ in range(30):
                  try:
                      status, body = request("GET", path)
                      if status == expected_status:
                          return body
                      last_error = RuntimeError(f"{path}: HTTP {status}")
                  except Exception as exc:
                      last_error = exc
                  time.sleep(2)
              raise RuntimeError(f"Timed out waiting for {path}: {last_error}")

          try:
              retry_get("/api/history")
              status, created = request(
                  "POST", "/api/games", {"mode": "HUMAN_VS_HUMAN"}
              )
              assert status == 201, (status, created)
              game_id = created["id"]
              status, moved = request(
                  "POST", f"/api/games/{game_id}/moves",
                  {"row": 3, "col": 4},
              )
              assert status == 200, (status, moved)
              assert moved["game"]["move_count"] == 1
              assert moved["game"]["board"][3][4] == "X"

              subprocess.run(
                  ["docker", "compose", "restart", "app"],
                  check=True, timeout=60,
              )
              restored = retry_get(f"/api/games/{game_id}")
              assert restored["move_count"] == 1
              assert restored["board"][3][4] == "X"
              assert restored["current_player"] == "O"

              history = retry_get("/api/history?limit=10&offset=0")
              records = [item for item in history["items"] if item["id"] == game_id]
              assert len(records) == 1
              assert records[0]["move_count"] == 1
              print("Compose persistence smoke passed across API container restart.")
          except Exception:
              subprocess.run(
                  ["docker", "compose", "logs", "--no-color", "app", "db"],
                  check=False,
              )
              raise
          PY
      - name: Stop and remove disposable Compose resources
        if: always()
        run: docker compose down --volumes --remove-orphans

  build:
    name: Build Docker image and publish approved release
    needs: [frontend, test, postgres-integration, compose-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE_NAME: docker.io/${{ secrets.DOCKERHUB_USERNAME || 'local-ci' }}/caroai
      RELEASE_RUN: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_approved }}
    steps:
      - uses: actions/checkout@v4
      - name: Derive traceable image tags
        id: image-tags
        shell: bash
        run: |
          echo "short_sha=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
          echo "source_sha=$GITHUB_SHA"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub for approved release
        if: env.RELEASE_RUN == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish SHA-tagged image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ env.RELEASE_RUN == 'true' }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:${{ steps.image-tags.outputs.short_sha }}
      - name: Trigger Render deployment
        if: env.RELEASE_RUN == 'true'
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK" || { echo "Missing RENDER_DEPLOY_HOOK secret"; exit 1; }
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK"
      - name: Verify deployed public HTTPS application and database readiness
        if: env.RELEASE_RUN == 'true'
        env:
          PUBLIC_URL: ${{ vars.CAROAI_PUBLIC_URL }}
        shell: bash
        run: |
          test -n "$PUBLIC_URL" || { echo "Set repository variable CAROAI_PUBLIC_URL to the public HTTPS base URL"; exit 1; }
          case "$PUBLIC_URL" in https://*) ;; *) echo "Public URL must use HTTPS"; exit 1 ;; esac
          for attempt in $(seq 1 36); do
            if curl --fail --silent --show-error "$PUBLIC_URL/health" >/dev/null && curl --fail --silent --show-error "$PUBLIC_URL/ready" >/dev/null; then
              echo "Public app liveness and database readiness checks passed: $PUBLIC_URL"
              exit 0
            fi
            sleep 10
          done
          echo "Deployment did not become healthy; collecting final public endpoint responses."
          curl --fail --show-error "$PUBLIC_URL/health"
          curl --fail --show-error "$PUBLIC_URL/ready"
          exit 1
