name: CaroAI CI

on:
  push:
    branches:
      - develop
      - "feature/**"
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend syntax and regression checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --check frontend/Caro_AI/trong_tran/script.js
      - run: node --test tests/frontend-regression.test.cjs

  test:
    name: Run tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - run: |
          python -m flake8 app tests scripts \
            --count \
            --max-complexity=10 \
            --max-line-length=127 \
            --statistics
      - run: python -m pytest -q tests/
      - run: docker compose config --quiet

  postgres-integration:
    name: PostgreSQL service/API/migration acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: caroai_test
          POSTGRES_USER: caroai_test
          POSTGRES_PASSWORD: caroai_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U caroai_test -d caroai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://caroai_test:caroai_test_password@localhost:5432/caroai_test
      CAROAI_TEST_DATABASE_CONFIRMED: disposable-test-database
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run PostgreSQL model and application acceptance tests
        run: >-
          python -m pytest -q
          tests/test_database_postgres.py tests/postgres_suite.py
          --junitxml=postgres-junit.xml
      - name: Fail if any PostgreSQL acceptance test was skipped
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("postgres-junit.xml").getroot()
          skipped = root.findall(".//skipped")
          if skipped:
              raise SystemExit(
                  f"PostgreSQL acceptance suite skipped {len(skipped)} test(s)"
              )
          print("PostgreSQL acceptance suite completed with zero skipped tests.")
          PY

  build:
    name: Build Docker image
    needs: [frontend, test, postgres-integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
