groups:
  - name: caroai-http
    rules:
      - alert: CaroAIHttp5xxRatioWarning
        expr: |
          sum(rate(caroai_http_requests_total{status=~"5.."}[5m]))
          / clamp_min(sum(rate(caroai_http_requests_total[5m])), 1)
          > 0.01
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CaroAI HTTP 5xx ratio is above 1%"
          description: "Review normalized route and status metrics before changing capacity."

      - alert: CaroAIHttp5xxRatioCritical
        expr: |
          sum(rate(caroai_http_requests_total{status=~"5.."}[5m]))
          / clamp_min(sum(rate(caroai_http_requests_total[5m])), 1)
          > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "CaroAI HTTP 5xx ratio is above 5%"

      - alert: CaroAIHttpP95Warning
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(caroai_http_request_duration_seconds_bucket[5m]))
          ) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CaroAI HTTP P95 is above 2 seconds"

      - alert: CaroAIHttpP95Critical
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(caroai_http_request_duration_seconds_bucket[5m]))
          ) > 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "CaroAI HTTP P95 is above 5 seconds"

  - name: caroai-ai
    rules:
      - alert: CaroAIImpossibleSearchP95Warning
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(caroai_ai_search_duration_seconds_bucket{
                difficulty="impossible",
                outcome!="tactical_shortcut"
              }[5m])
            )
          ) > 2.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "IMPOSSIBLE search P95 is above 2.5 seconds"
          description: "Compare node count, branching, pruning, timeouts and Render CPU."

      - alert: CaroAIImpossibleSearchP95Critical
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(caroai_ai_search_duration_seconds_bucket{
                difficulty="impossible",
                outcome!="tactical_shortcut"
              }[5m])
            )
          ) > 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "IMPOSSIBLE search P95 is above 5 seconds"

      - alert: CaroAIImpossibleAdmissionRejections
        expr: increase(caroai_ai_admission_rejections_total{difficulty="impossible"}[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "IMPOSSIBLE admission guard rejected one or more requests"
          description: "Confirm whether expected back-pressure is impacting user experience."

  - name: caroai-database
    rules:
      - alert: CaroAIDbPoolOccupancyWarning
        expr: caroai_db_connections_checked_out > 12
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CaroAI SQLAlchemy pool has more than 12 connections checked out"

      - alert: CaroAIDbPoolOccupancyCritical
        expr: caroai_db_connections_checked_out > 14
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "CaroAI SQLAlchemy pool is near its default 15-connection per-process cap"

      - alert: CaroAIDbConnectionHoldP95Warning
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(caroai_db_connection_hold_seconds_bucket[5m]))
          ) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "DB connection-hold P95 is above 500 ms"

      - alert: CaroAIDbConnectionHoldP95Critical
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(caroai_db_connection_hold_seconds_bucket[5m]))
          ) > 2
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "DB connection-hold P95 is above 2 seconds"

      - alert: CaroAIDbTransactionP95Warning
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(caroai_db_transaction_duration_seconds_bucket[5m]))
          ) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Root SQL transaction P95 is above 500 ms"

      - alert: CaroAIDbTransactionP95Critical
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(caroai_db_transaction_duration_seconds_bucket[5m]))
          ) > 2
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Root SQL transaction P95 is above 2 seconds"
