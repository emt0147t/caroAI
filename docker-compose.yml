version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: caro_ai_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - PORT=8000
      - DATABASE_URL=postgresql://carouser:caropass@db:5432/carodb
    env_file:
      - .env.example
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - caro_network

  db:
    image: postgres:15-alpine
    container_name: caro_ai_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: carouser
      POSTGRES_PASSWORD: caropass
      POSTGRES_DB: carodb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carouser -d carodb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - caro_network

networks:
  caro_network:
    driver: bridge

volumes:
  postgres_data:
