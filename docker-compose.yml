version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: caroai-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-caroai_db}
      POSTGRES_USER: ${POSTGRES_USER:-caroai_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-caroai_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-caroai_user} -d $${POSTGRES_DB:-caroai_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: caroai-backend
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-caroai_user}:${POSTGRES_PASSWORD:-caroai_password}@db:5432/${POSTGRES_DB:-caroai_db}
      APP_ENV: ${APP_ENV:-development}
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
