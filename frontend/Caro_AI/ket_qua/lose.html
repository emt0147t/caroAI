<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cờ CARO AI - Thua Cuộc</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #f4efeb;
            --card-bg: #ffffff;
            --border-color: #e2d9d0;
            --text-main: #2c2523;
            --text-sub: #786e65;
            --color-lose: #e05638;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 24px; }
        .result-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 24px; padding: 40px 32px; box-shadow: 0 16px 36px rgba(60, 40, 20, 0.06); text-align: center; max-width: 420px; width: 100%; }
        .status-badge { display: inline-flex; align-items: center; gap: 8px; background: rgba(224, 86, 56, 0.12); color: var(--color-lose); padding: 8px 16px; border-radius: 99px; font-size: 0.9rem; font-weight: 700; margin-bottom: 24px; }
        .result-icon { font-size: 4rem; margin-bottom: 16px; line-height: 1; }
        .result-title { font-size: 1.8rem; font-weight: 800; color: var(--text-main); margin-bottom: 8px; letter-spacing: -0.5px; }
        .result-subtitle { font-size: 0.95rem; color: var(--text-sub); margin-bottom: 32px; line-height: 1.5; }
        .stats-box { background: #fbf8f5; border: 1px solid var(--border-color); border-radius: 14px; padding: 16px; display: flex; justify-content: space-around; margin-bottom: 32px; }
        .stat-item { text-align: center; }
        .stat-label { font-size: 0.8rem; color: var(--text-sub); font-weight: 600; margin-bottom: 4px; }
        .stat-value { font-size: 1.1rem; color: var(--text-main); font-weight: 800; }
        .actions { display: flex; gap: 12px; }
        .btn { flex: 1; padding: 12px 18px; border-radius: 12px; font-size: 0.95rem; font-weight: 700; cursor: pointer; border: none; transition: all 0.2s; text-decoration: none; display: inline-flex; justify-content: center; align-items: center; }
        .btn-primary { background: var(--text-main); color: #ffffff; }
        .btn-primary:hover { background: #443a37; transform: translateY(-1px); }
        .btn-secondary { background: var(--bg-main); color: var(--text-main); border: 1px solid var(--border-color); }
        .btn-secondary:hover { background: #eae1d7; }
    </style>
</head>
<body>
    <div class="result-card">
        <div class="status-badge">
            <span>🤖</span> Đối thủ thắng
        </div>
        <div class="result-icon">🧩</div>
        <h1 class="result-title">Bạn Đã Thua!</h1>
        <p class="result-subtitle">AI đã khai thác được sơ hở trên bàn cờ. Hãy thử lại để phục thù ván đấu này!</p>
        
        <div class="stats-box">
            <div class="stat-item">
                <div class="stat-label">Thời gian</div>
                <div class="stat-value">04:12</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Tổng nước đi</div>
                <div class="stat-value">35</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Kết quả</div>
                <div class="stat-value" style="color: var(--color-lose);">Thua</div>
            </div>
        </div>

        <div class="actions">
            <a href="index.html" class="btn btn-secondary">Xem lại cờ</a>
            <a href="index.html" class="btn btn-primary">Chơi lại</a>
        </div>
    </div>
</body>
</html>
