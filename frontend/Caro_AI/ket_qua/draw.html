<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CaroAI · Hòa Trận</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/tokens.css">
    <script src="/theme-sound.js"></script>
    <script>
        // Canonical forwarding: if game_id is present, forward to the authoritative board view
        const params = new URLSearchParams(window.location.search);
        const gameId = params.get("game_id");
        if (gameId) {
            window.location.replace("/trong_tran/index.html?game_id=" + encodeURIComponent(gameId));
        } else {
            // Never display a fixed outcome without an authoritative game identifier.
            window.location.replace("/");
        }
    </script>
    <style>
        :root {
            --bg-main: var(--ui-color-canvas);
            --card-bg: var(--ui-color-surface);
            --border-color: var(--ui-color-border);
            --text-main: var(--ui-color-text);
            --text-sub: var(--ui-color-muted);
            --color-draw: var(--ui-color-warning);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--ui-font); }
        body { background-color: var(--bg-main); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 24px; transition: background-color var(--ui-motion-base), color var(--ui-motion-base); }
        .result-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--ui-radius-feature); padding: 40px 32px; box-shadow: var(--ui-shadow-card); text-align: center; max-width: 440px; width: 100%; }
        .status-badge { display: inline-flex; align-items: center; gap: 8px; background: var(--ui-color-warning-soft); color: var(--color-draw); padding: 8px 16px; border-radius: 99px; font-size: 0.9rem; font-weight: 700; margin-bottom: 24px; }
        .result-icon { width: 56px; height: 56px; margin: 0 auto 16px; display: grid; place-items: center; border-radius: 14px; background: var(--ui-color-warning-soft); color: var(--color-draw); }
        .result-title { font-size: 1.85rem; font-weight: 800; color: var(--text-main); margin-bottom: 8px; letter-spacing: -0.5px; }
        .result-subtitle { font-size: 0.95rem; color: var(--text-sub); margin-bottom: 32px; line-height: 1.5; }
        .actions { display: flex; gap: 12px; }
        .btn { flex: 1; padding: 12px 18px; border-radius: 12px; font-size: 0.95rem; font-weight: 700; cursor: pointer; border: none; transition: background var(--ui-motion-fast), transform var(--ui-motion-fast); text-decoration: none; display: inline-flex; justify-content: center; align-items: center; }
        .btn-primary { background: var(--text-main); color: var(--card-bg); }
        .btn-primary:hover { background: var(--ui-color-accent); color: #ffffff; transform: translateY(-1px); }
        .btn-secondary { background: var(--card-bg); color: var(--text-main); border: 1px solid var(--border-color); }
        .btn-secondary:hover { background: var(--ui-color-surface-subdued); }
    </style>
</head>
<body>
    <div class="result-card">
        <div class="status-badge">
            Kết quả ván đấu
        </div>
        <div class="result-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="9" x2="19" y2="9"></line>
                <line x1="5" y1="15" x2="19" y2="15"></line>
            </svg>
        </div>
        <h1 class="result-title">Hòa Trận!</h1>
        <p class="result-subtitle">Kết quả và thế cờ được bảo lưu tự động bởi Backend. Bạn có thể mở lại bàn đấu chính thức hoặc xem danh sách ván đấu.</p>

        <div class="actions">
            <a href="/welcome.html" class="btn btn-primary">Bắt Đầu Ván Mới</a>
            <a href="/history.html" class="btn btn-secondary">Xem Lịch Sử</a>
        </div>
    </div>
</body>
</html>
