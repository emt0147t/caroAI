<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cờ CARO AI - Trang Chờ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #f4efeb;
            --card-bg: #ffffff;
            --border-color: #e2d9d0;
            --text-main: #2c2523;
            --text-sub: #786e65;
            --accent-color: #2b8a6e;
            --accent-light: #e8f3f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
        }

        .welcome-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            padding: 40px 36px;
            box-shadow: 0 20px 40px rgba(60, 40, 20, 0.06);
            max-width: 460px;
            width: 100%;
            text-align: center;
        }

        /* Đồng hồ thời gian thực */
        .clock-widget {
            background: #faf7f4;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 12px 20px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 28px;
        }

        .clock-icon {
            font-size: 1.1rem;
        }

        .clock-time {
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--text-main);
            font-variant-numeric: tabular-nums;
        }

        /* Header Logo */
        .game-logo {
            width: 72px;
            height: 72px;
            background: var(--text-main);
            color: #ffffff;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: 800;
            margin: 0 auto 16px;
            box-shadow: 0 10px 20px rgba(44, 37, 35, 0.15);
        }

        .title {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 0.95rem;
            color: var(--text-sub);
            margin-bottom: 32px;
            line-height: 1.5;
        }

        /* Bảng thiết lập */
        .option-group {
            margin-bottom: 24px;
            text-align: left;
        }

        .option-label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            display: block;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .option-btn {
            background: #faf7f4;
            border: 1.5px solid var(--border-color);
            padding: 12px 8px;
            border-radius: 14px;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .option-btn.active {
            background: var(--accent-light);
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        /* Nút Bắt đầu */
        .start-btn {
            width: 100%;
            background: var(--text-main);
            color: #ffffff;
            border: none;
            padding: 16px;
            border-radius: 16px;
            font-size: 1.05rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .start-btn:hover {
            background: #443a37;
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(44, 37, 35, 0.15);
        }

        .footer-note {
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="welcome-card">
        <!-- Đồng hồ thời gian thực -->
        <div class="clock-widget">
            <span class="clock-icon">🕒</span>
            <span class="clock-time" id="realtimeClock">00:00:00</span>
        </div>

        <!-- Logo Cờ Caro -->
        <div class="game-logo">#</div>

        <h1 class="title">Cờ Caro AI</h1>
        <p class="subtitle">Chọn chế độ chơi. Backend là nguồn sự thật cho game state và luật chơi.</p>

        <!-- Lựa chọn chế độ -->
        <div class="option-group">
            <span class="option-label">Chọn chế độ</span>
            <div class="options-grid">
                <button class="option-btn active" data-mode="HUMAN_VS_HUMAN">Người vs Người</button>
                <button class="option-btn" data-mode="HUMAN_VS_AI">Người vs AI</button>
            </div>
        </div>

        <!-- AI difficulty is selected after the AI contract is implemented. -->
        <div class="option-group">
            <span class="option-label">Chọn quân đi trước</span>
            <div class="options-grid" style="grid-template-columns: repeat(2, 1fr);">
                <button class="option-btn active">X (Đi trước)</button>
                <button class="option-btn">O (Đi sau)</button>
            </div>
        </div>

        <!-- Nút Bắt đầu ván đấu -->
        <button id="startBtn" class="start-btn" type="button">
            <span>Bắt Đầu Ván Đấu</span>
            <span>➔</span>
        </button>

        <p class="footer-note">Bàn cờ 15 × 15 · Backend xử lý luật và trạng thái.</p>
    </div>

    <!-- Script cập nhật đồng hồ -->
    <script>
        const buttons = document.querySelectorAll("[data-mode]");
        const startButton = document.getElementById("startBtn");
        let selectedMode = "HUMAN_VS_HUMAN";
        buttons.forEach((button) => button.addEventListener("click", () => {
            selectedMode = button.dataset.mode;
            buttons.forEach((item) => item.classList.remove("active"));
            button.classList.add("active");
        }));
        startButton.addEventListener("click", () => {
            window.location.href = "trong_tran/index.html?mode=" + encodeURIComponent(selectedMode);
        });
        function updateClock() {
            const now = new Date();
            document.getElementById("realtimeClock").textContent =
                [now.getHours(), now.getMinutes(), now.getSeconds()].map((v) => String(v).padStart(2, "0")).join(":");
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
