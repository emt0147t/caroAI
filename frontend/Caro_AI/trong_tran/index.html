<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cờ Caro AI · Bàn Đấu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="style.css">
  <script src="/theme-sound.js"></script>
</head>
<body>
<main class="app-container">
  <header class="app-header">
    <div class="brand">
      <a href="/" class="brand-link" title="Về trang chủ">
        <span class="logo-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M4 4h4v4H4V4zm6 0h4v4h-4V4zm6 0h4v4h-4V4zM4 10h4v4H4v-4zm6 0h4v4h-4v-4zm6 0h4v4h-4v-4zM4 16h4v4H4v-4zm6 0h4v4h-4v-4zm6 0h4v4h-4v-4z"/>
          </svg>
        </span>
        <h1 class="app-title">Cờ CARO AI</h1>
      </a>
    </div>

    <div class="header-actions">
      <button id="soundToggleBtn" class="header-ctrl-btn" type="button" aria-label="Bật/Tắt âm thanh"></button>
      <button id="themeToggleBtn" class="header-ctrl-btn" type="button" aria-label="Chuyển đổi giao diện"></button>
      <a href="../history.html" class="history-link">Lịch sử</a>
      <label class="sr-only" for="gameMode">Chế độ chơi</label>
      <select id="gameMode" aria-label="Chế độ chơi">
        <option value="HUMAN_VS_HUMAN">Người vs Người</option>
        <option value="HUMAN_VS_AI">Người vs AI</option>
      </select>
      <div id="difficultyGroup" class="difficulty-control hidden">
        <label class="sr-only" for="aiDifficulty">Độ khó AI</label>
        <select id="aiDifficulty" aria-label="Độ khó AI">
          <option value="easy">Dễ</option>
          <option value="medium" selected>Trung bình</option>
          <option value="hard">Khó</option>
        </select>
      </div>
      <button id="newGameBtn" class="btn-primary" type="button">Ván mới</button>
    </div>
  </header>

  <section class="status-bar" aria-live="polite">
    <div id="turnBox" class="turn-indicator">
      <span class="turn-label">Lượt đánh:</span>
      <span id="currentPlayer" class="tag tag-x">X</span>
    </div>
    <div id="loadingBox" class="loading-indicator hidden">
      <span class="pulse-dot" aria-hidden="true"></span>
      <span class="loading-text">Đang xử lý...</span>
    </div>
    <div id="gameStatus" class="game-alert" role="status"></div>
  </section>

  <section id="resultPanel" class="result-panel hidden" role="status" aria-live="polite">
    <div class="result-content">
      <p class="result-kicker">VÁN ĐẤU KẾT THÚC</p>
      <h2 id="resultTitle"></h2>
      <p id="resultDetail" class="result-detail">Kết quả được đồng bộ từ Backend.</p>
    </div>
    <div class="result-actions">
      <button id="resultNewGame" class="btn-primary" type="button">Chơi ván mới</button>
      <a href="../history.html" class="history-link">Xem lịch sử</a>
    </div>
  </section>

  <section id="errorBox" class="error-box hidden" role="alert">
    <div class="error-content">
      <strong>Không thể thực hiện thao tác.</strong>
      <span id="errorMessage"></span>
    </div>
    <button id="retryBtn" type="button" class="btn-secondary">Thử lại</button>
  </section>

  <section class="board-container" aria-label="Bàn cờ Caro 15 x 15">
    <div id="board" class="caro-board" role="grid" aria-label="Bàn cờ Caro 15 x 15" aria-rowcount="15" aria-colcount="15" aria-busy="false" tabindex="-1"></div>
  </section>

  <footer class="board-footer">
    <p class="footer-note">Bàn cờ 15 × 15 · Backend quyết định lượt đi và kết quả ván đấu.</p>
  </footer>
</main>

<script src="script.js"></script>
</body>
</html>
